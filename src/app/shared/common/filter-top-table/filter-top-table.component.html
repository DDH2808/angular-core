<div
  class="filter-top-table d-flex justify-content-between align-items-center gap-2"
>
  <div class="left d-flex align-items-center gap-2">
    <ng-container *ngFor="let filter of configFilters">
      <ng-container *ngIf="filter.type === ETypeFilter.SEARCH">
        <custom-input-search
          [className]="'input-medium'"
          (searchEvent)="onSearch($event, filter.name)"
          [placeholder]="filter.placeholder || 'Search...'"
        ></custom-input-search>
      </ng-container>
      <ng-container *ngIf="filter.type === ETypeFilter.SELECT">
        <custom-select-search
          [value]="filter?.value"
          [minWidth]="filter?.minWidth"
          [className]="''"
          [selectData]="filter"
          (selectEvent)="onSelectValue($event, filter.name)"
          (scrollToEndEvent)="scrollToEndEvent.emit(filter.name)"
        ></custom-select-search>
      </ng-container>
    </ng-container>
    <ng-content select="[additionFilters]"></ng-content>
  </div>
  <div class="right d-flex align-items-center gap-2">
    <ng-container *ngFor="let filter of configButtons">
      <button
        type="button"
        class="btn button-medium {{
          filter.className
        }} center-item button-filter-top"
        [ngClass]="{
          'button-fill primary-color': filter.type === ETypeButton.PRIMARY,
          'button-outline': filter.type === ETypeButton.DEFAULT,
          'button-sub-primary  secondary-color2':
            filter.type === ETypeButton.SUB_PRIMARY,
        }"
        (click)="onClick(filter.name || 'button')"
        [disabled]="filter.disabled"
      >
        <ng-container *ngIf="!filter.loading">
          <img
            *ngIf="filter.icon"
            src="{{ filter.icon }}"
            alt=""
            class="icon"
            [ngClass]="{'me-1': !!filter.label}"
          />
          <img
            *ngIf="filter.activeIcon || filter.icon"
            src="{{ filter.activeIcon ?? filter.icon }}"
            alt=""
            class="activeIcon"
            [ngClass]="{'me-1': !!filter.label}"
          />
        </ng-container>
        <ng-container *ngIf="filter.loading">
          <i
            class="fas fa-spinner fa-spin me-1-2"
            [ngClass]="{'me-1': !!filter.label}"
          ></i>
        </ng-container>
        {{ filter.label }}
      </button>
    </ng-container>
  </div>
</div>

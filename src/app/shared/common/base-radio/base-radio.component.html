<div class="basic-radio {{ class }}">
  <input
    type="radio"
    id="{{ id }}"
    class="check"
    name="{{ name }}"
    [checked]="value === selectedValue || checked"
    [value]="value"
    [class.disabled]="disabled"
    [readonly]="disabled"
    [disabled]="disabled"
    (change)="onChange($any($event).target.value)"
  />
  <label for="{{ id }}">
    <div class="container">
      <div class="cRadioBtn">
        <div class="overlay"></div>
        <div class="drops xsDrop"></div>
        <div class="drops mdDrop"></div>
        <div class="drops lgDrop"></div>
      </div>
    </div>
    <span>
      <span>{{ label }}</span>
    </span>
  </label>
</div>

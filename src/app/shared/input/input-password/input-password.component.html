<ng-container>
  <div class="form-item-password position-relative">
    <label for="{{ id }}">
      {{ label }}
      <span class="required">*</span>
    </label>
    <input
      [ngClass]="ngClass"
      autocomplete="password"
      [type]="showPassword ? 'text' : 'password'"
      id="password"
      name="password"
      [(ngModel)]="value"
      (input)="handleType($event)"
      placeholder="Nhập Mật khẩu..."
    />
    <img
      class="show-password-btn"
      src="{{
        showPassword
          ? './assets/images/icon/eyeSlash.svg'
          : './assets/images/icon/eye.svg'
      }}"
      (click)="handleShowPassword()"
    />
  </div>
</ng-container>
